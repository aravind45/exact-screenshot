<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#FAFAFA"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E5E7EB" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Timeline base line -->
  <line x1="100" y1="200" x2="1100" y2="200" stroke="#D1D5DB" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Phase 1: Discovery & Planning -->
  <g id="phase1">
    <circle cx="150" cy="200" r="16" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="150" cy="200" r="8" fill="#FFFFFF"/>
    
    <rect x="110" y="80" width="80" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="150" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Discovery</text>
    <text x="150" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Asset Search</text>
    <text x="150" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Document Scan</text>
    <text x="150" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Heir Mapping</text>
    
    <text x="150" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Phase 1</text>
    <text x="150" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Planning</text>
  </g>
  
  <!-- Phase 2: Authority & Probate -->
  <g id="phase2">
    <circle cx="350" cy="200" r="16" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="350" cy="200" r="8" fill="#FFFFFF"/>
    
    <rect x="310" y="80" width="80" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="350" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Authority</text>
    <text x="350" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">File Petition</text>
    <text x="350" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Court Hearing</text>
    <text x="350" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Get Letters</text>
    
    <text x="350" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Phase 2</text>
    <text x="350" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Probate</text>
  </g>
  
  <!-- Phase 3: Asset Collection -->
  <g id="phase3">
    <circle cx="550" cy="200" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="550" cy="200" r="8" fill="#FFFFFF"/>
    
    <rect x="510" y="80" width="80" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="550" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Collection</text>
    <text x="550" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Contact Banks</text>
    <text x="550" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Transfer Assets</text>
    <text x="550" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Inventory</text>
    
    <text x="550" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Phase 3</text>
    <text x="550" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Assets</text>
  </g>
  
  <!-- Phase 4: Claims & Debts -->
  <g id="phase4">
    <circle cx="750" cy="200" r="16" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="750" cy="200" r="8" fill="#FFFFFF"/>
    
    <rect x="710" y="80" width="80" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="750" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Claims</text>
    <text x="750" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Notice Period</text>
    <text x="750" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Pay Debts</text>
    <text x="750" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Resolve Claims</text>
    
    <text x="750" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Phase 4</text>
    <text x="750" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Liabilities</text>
  </g>
  
  <!-- Phase 5: Distribution & Closing -->
  <g id="phase5">
    <circle cx="950" cy="200" r="16" fill="#06B6D4" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="950" cy="200" r="8" fill="#FFFFFF"/>
    
    <rect x="910" y="80" width="80" height="90" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="950" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1F2937" text-anchor="middle">Distribution</text>
    <text x="950" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Final Account</text>
    <text x="950" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Distribute</text>
    <text x="950" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6B7280" text-anchor="middle">Close Estate</text>
    
    <text x="950" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1F2937" text-anchor="middle">Phase 5</text>
    <text x="950" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Closing</text>
  </g>
  
  <!-- Completion checkmark -->
  <g id="completion">
    <circle cx="1100" cy="200" r="20" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 1090 200 L 1097 207 L 1110 190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="1100" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">Complete</text>
    <text x="1100" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280" text-anchor="middle">Estate Closed</text>
  </g>
  
  <!-- Connecting lines between phases -->
  <line x1="166" y1="200" x2="334" y2="200" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="366" y1="200" x2="534" y2="200" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="566" y1="200" x2="734" y2="200" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="766" y1="200" x2="934" y2="200" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="966" y1="200" x2="1080" y2="200" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Title -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1F2937" text-anchor="middle">Your Settlement Journey</text>
  <text x="600" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle">Guided step-by-step with automated tracking and court-ready documentation</text>
</svg>
